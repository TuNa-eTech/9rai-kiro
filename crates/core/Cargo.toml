[package]
name = "nine-rai-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "MITM engine: TLS interception, CodeWhisperer<->OpenAI translation, AWS EventStream encoding"

[lib]
name = "nine_rai_core"
path = "src/lib.rs"

[dependencies]
tokio.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rustls-pki-types.workspace = true
webpki-roots.workspace = true
rcgen.workspace = true

hyper.workspace = true
hyper-util.workspace = true
http-body-util.workspace = true
bytes.workspace = true

reqwest.workspace = true
hickory-resolver.workspace = true

serde.workspace = true
serde_json.workspace = true

thiserror.workspace = true
tracing.workspace = true

crc32fast.workspace = true
dashmap.workspace = true
dirs.workspace = true
futures-util.workspace = true
sha1.workspace = true
time.workspace = true
x509-parser = "0.18"

[target.'cfg(unix)'.dependencies]
# chown back to the invoking user after a root daemon writes files; see paths.rs.
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
# Independent decoder from AWS itself: catches encoder bugs our own decoder never could.
aws-smithy-eventstream = "0.61"
# Property tests for the incremental SSE reader.
proptest = "1"
