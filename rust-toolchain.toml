# Pinned for reproducibility: a research artifact must build identically for reviewers.
# `stable` on this machine resolves to 1.83.0, which predates the MSRV of several
# dependencies (rcgen 0.14, reqwest 0.13, hickory-resolver 0.26).
[toolchain]
channel = "1.98.0"
components = ["rustfmt", "clippy"]
targets = ["aarch64-apple-darwin", "x86_64-pc-windows-msvc"]
